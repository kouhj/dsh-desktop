name: Windows 7 SP1 build

# Builds the DSH Desktop compatibility channel for Windows 7 SP1: Electron 22.3.27
# (Chromium 108 / Node 16.17, the last release supporting Windows 7) with a
# Chromium 108-downlevelled renderer, the bundled offline runtime, and static
# artifact gates proving the produced installers still target Windows 7.
#
# The runtime compatibility report is committed at win7/COMPATIBILITY.md.

on:
  workflow_dispatch:
  push:
    branches:
      - win7-sp1
    tags:
      - 'win7-v*'

permissions:
  contents: read

concurrency:
  group: win7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_WIN7_COMPAT: '1'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build Windows 7 SP1 artifacts
    # windows-2022 is pinned deliberately: windows-latest is Windows Server 2025
    # and its image changes away from the Electron 22 toolchain assumptions.
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: Check out the compatibility branch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node 22 (build host only; the app bundles Electron 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - run: corepack enable

      - name: Resolve the Yarn cache folder
        id: yarn-cache-dir
        shell: pwsh
        run: echo "dir=$(yarn config get cacheFolder)" >> $env:GITHUB_OUTPUT

      - name: Restore the Yarn cache
        id: yarn-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: win7-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            win7-yarn-${{ runner.os }}-

      # Offline-capable builds need every downloaded payload pre-seeded. The
      # caches below cover Electron 22's dist zip, electron-builder's NSIS and
      # winCodeSign toolsets, and the bundled primary runtime (Node + Python).
      - name: Restore packaging downloads
        id: packaging-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            dsh-plugin-desktop/.desktop-build/downloads
            dsh-plugin-desktop/.desktop-build/runtime
          key: win7-packaging-${{ runner.os }}-${{ hashFiles('dsh-plugin-desktop/package.json', 'deepseek-harness/scripts/primary-runtime/lock.json') }}
          restore-keys: |
            win7-packaging-${{ runner.os }}-

      - name: Install workspace dependencies
        run: yarn install --immutable

      - name: Save the Yarn cache
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}

      - name: Assert the Windows 7 Electron pin
        shell: pwsh
        run: |
          $version = node -p "require('./dsh-plugin-desktop/node_modules/electron/package.json').version"
          if ($version -ne '22.3.27') { throw "Expected Electron 22.3.27, found $version" }
          Write-Output "Electron $version (Chromium 108 / Node 16.17) pinned for Windows 7"

      - name: Build the Electron 22 shell and Chromium 108 renderer
        run: yarn workspace dsh-plugin-desktop build

      - name: Reject modern CSS that Chromium 108 drops
        shell: pwsh
        run: |
          $lib = 'dsh-plugin-desktop/lib'
          $css = Get-ChildItem -Path $lib -Recurse -Include *.css,*.js -File | Where-Object { $_.Extension -in '.css', '.js' }
          $scope = $css | Select-String -Pattern '@scope' -SimpleMatch
          $oklch = $css | Where-Object { $_.Extension -eq '.css' } | Select-String -Pattern 'oklch(' -SimpleMatch
          if ($scope) { throw "Chromium 108 build still emits @scope: $($scope.Path -join ', ')" }
          if ($oklch) { throw "Chromium 108 build still emits oklch(): $($oklch.Path -join ', ')" }
          Write-Output "Renderer CSS is Chromium 108 compatible"

      - name: Build the Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          # CI artifacts are never published; skipping compression saves minutes.
          DSH_WINDOWS_PACKAGE_COMPRESSION: store
        run: yarn workspace dsh-plugin-desktop dist:win

      - name: Build the portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DSH_WINDOWS_PACKAGE_COMPRESSION: store
          DSH_WINDOWS_REUSE_UNPACKED: '1'
        run: yarn workspace dsh-plugin-desktop dist:win-portable

      - name: Verify the Windows 7 artifact shape
        run: node dsh-plugin-desktop/scripts/win7/verify-win7-artifacts.mjs

      - name: Save packaging downloads
        if: steps.packaging-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            dsh-plugin-desktop/.desktop-build/downloads
            dsh-plugin-desktop/.desktop-build/runtime
          key: ${{ steps.packaging-cache.outputs.cache-primary-key }}

      # The packaged runtime smoke inside the packaging hooks is skipped for this
      # channel (DSH_WIN7_COMPAT=1) because it executes the Node 24 DSH runtime,
      # which cannot run under Electron 22's Node 16. This step records the proof
      # instead of letting a known architecture blocker fail the build silently.
      - name: Record the known runtime compatibility blocker
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = 'dsh-plugin-desktop/dist/win-unpacked/DSH Desktop.exe'
          $entry = 'dsh-plugin-desktop/dist/win-unpacked/resources/app/lib/main.js'
          $exitCode = 'not-run'
          $detail = ''
          try {
            $env:ELECTRON_RUN_AS_NODE = '1'
            $detail = (& $exe $entry 2>&1 | Out-String).Trim()
            $exitCode = $LASTEXITCODE
          } catch {
            $exitCode = "launch-failed: $($_.Exception.Message)"
          } finally {
            Remove-Item Env:\ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          }
          $markdown = @"
          ### Windows 7 runtime probe (evidence, not a pass/fail gate)

          `- Electron 22 entry probe exit code: $exitCode
          `- First output lines:
          ```
          $($detail.Substring(0, [Math]::Min(1500, $detail.Length)))
          ```
          "@
          $markdown | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit 0

      - name: Upload Windows 7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win7-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dsh-plugin-desktop/dist/DSH-Desktop-*-x64-Setup.exe
            dsh-plugin-desktop/dist/DSH-Desktop-*-x64-Portable.zip
            dsh-plugin-desktop/dist/win7-verification.json
            win7/COMPATIBILITY.md

      - name: Publish the Windows 7 artifacts (tags only)
        if: startsWith(github.ref, 'refs/tags/win7-v')
        uses: softprops/action-gh-release@v2
        with:
          name: DSH Desktop ${{ github.ref_name }} (Windows 7 SP1)
          body_path: win7/COMPATIBILITY.md
          files: |
            dsh-plugin-desktop/dist/DSH-Desktop-*-x64-Setup.exe
            dsh-plugin-desktop/dist/DSH-Desktop-*-x64-Portable.zip
            dsh-plugin-desktop/dist/win7-verification.json
          fail_on_unmatched_files: true
